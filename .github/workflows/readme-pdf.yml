name: Generate README PDF

on:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/scripts/readme-pdf.sh
      - .github/scripts/publish-readme-pdf.sh
      - .github/scripts/test-publish-readme-pdf.py
      - .github/scripts/readme-pdf.css
      - .github/workflows/readme-pdf.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-pdf
  cancel-in-progress: true

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Test publication with a concurrent update
        run: python3 .github/scripts/test-publish-readme-pdf.py

      - name: Install PDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc fonts-dejavu-core fonts-noto-color-emoji
          google-chrome --version

      - name: Generate and publish cv/README.pdf from current sources
        run: bash .github/scripts/publish-readme-pdf.sh
