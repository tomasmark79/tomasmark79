name: Generate README PDF

on:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/scripts/readme-pdf.sh
      - .github/scripts/readme-pdf.css
      - .github/workflows/readme-pdf.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-pdf
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install PDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc fonts-dejavu-core fonts-noto-color-emoji
          google-chrome --version

      - name: Generate README.pdf
        run: bash .github/scripts/readme-pdf.sh

      - name: Commit README.pdf
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.pdf
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'docs: regenerate README.pdf'
          git push origin HEAD:main
